name: Review Bot Gate Fork Review

# Managed by aidevops framework.
# Upstream logic lives in: marcusquinn/aidevops/.github/workflows/review-bot-gate-fork-review-reusable.yml
# This caller is tiny on purpose — all the logic is centralised upstream.
#
# Trusted write path for fork PR review events (GH#39418).
# Fork PR review runs of "Review Bot Gate" receive a read-only token and cannot
# clear a failing review-bot-gate status under completion_behavior: strict. This
# workflow listens for those runs via workflow_run, which executes in the base
# repository context with a write-capable token. It checks out only aidevops
# scripts, never fork PR code.
#
# This listener must stay a separate workflow from review-bot-gate.yml: GitHub
# rejects a workflow whose workflow_run trigger names itself ("Workflow 'Review
# Bot Gate' cannot listen to itself"), which would invalidate the required
# review-bot-gate status for every event.
#
# To manage this file:
#   aidevops check-workflows       # detect drift vs canonical template
#   aidevops sync-workflows        # preview resync plan
#   aidevops sync-workflows --apply
#
# Pinning options:
#   @main           ← auto-update; what this template uses by default
#   @v3.9.0         ← pin to a specific aidevops version for stability
#                     (bump via aidevops sync-workflows after upgrades)

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] base context; scripts only, no PR code executed
    workflows: ["Review Bot Gate"]
    types: [completed]

# Permissions ceiling for downstream repos with default_workflow_permissions: read.
permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  gate-fork-review:
    if: >
      github.event_name == 'workflow_run' &&
      (
        github.event.workflow_run.event == 'pull_request_review' ||
        github.event.workflow_run.event == 'pull_request_review_comment'
      ) &&
      github.event.workflow_run.head_repository.full_name != github.repository &&
      (
        github.event.workflow_run.actor.login == 'coderabbitai' ||
        github.event.workflow_run.actor.login == 'coderabbitai[bot]' ||
        github.event.workflow_run.actor.login == 'gemini-code-assist' ||
        github.event.workflow_run.actor.login == 'gemini-code-assist[bot]' ||
        github.event.workflow_run.actor.login == 'augment-code' ||
        github.event.workflow_run.actor.login == 'augment-code[bot]' ||
        github.event.workflow_run.actor.login == 'augmentcode' ||
        github.event.workflow_run.actor.login == 'augmentcode[bot]' ||
        github.event.workflow_run.actor.login == 'copilot' ||
        github.event.workflow_run.actor.login == 'copilot[bot]' ||
        github.event.workflow_run.actor.login == 'github-actions[bot]'
      )
    concurrency:
      group: review-bot-gate-fork-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    uses: marcusquinn/aidevops/.github/workflows/review-bot-gate-fork-review-reusable.yml@main
    with:
      # Keep this equal to the ref on `uses:` so helper code is pinned with the reusable YAML.
      aidevops_ref: main
      # Explicit CI opt-in: set this Actions variable to strict when required.
      completion_behavior: ${{ vars.AIDEVOPS_REVIEW_GATE_COMPLETION_BEHAVIOR || 'fast' }}
    secrets:
      AIDEVOPS_READ_TOKEN: ${{ secrets.AIDEVOPS_READ_TOKEN }}
