#
# dispatch-cost-budgets.conf — Cost-per-issue circuit breaker (t2007)
#
# Per-tier cumulative token budget for worker dispatch. When the sum of
# token spend across all worker attempts on an issue exceeds the tier
# budget, dispatch-dedup-cost.sh::_check_cost_budget applies
# `status:blocked`, posts one explanatory comment, files a root-cause
# meta-issue, and emits the COST_BUDGET_EXCEEDED signal that blocks
# further dispatch.
#
# Repository override (t18729):
#   A managed repository may commit `.aidevops/dispatch-cost-budgets.conf`
#   in its own checkout (path from repos.json). It is parsed as data, never
#   sourced: only exact `COST_BUDGET_SIMPLE|STANDARD|THINKING|DEFAULT=<digits>`
#   lines are read, and each value is clamped to 100000–100000000 tokens.
#   Keys it omits keep the values below. Changes go through that
#   repository's reviewed PRs and apply on every runner.
#   Units (GH#40030): add the line `COST_BUDGET_UNIT=full-v1` when the values
#   are full-usage tokens like the defaults below. Without it the file is read
#   as legacy non-cache tokens (written against the old 800K default) and each
#   value is multiplied by 25 before clamping, so a legacy 2000000 override
#   keeps meaning "more than the default" instead of tripping on one attempt.
#
# Spend is aggregated by parsing the `spent N tokens` and `has used N tokens`
# patterns from signature footers in issue comments — the same data that
# `gh-signature-helper.sh footer` writes for every worker comment. No new
# instrumentation required. New footers mark full usage (input, output,
# reasoning, cache read and cache write). Legacy counts remain a lower bound;
# missing historical cache usage cannot be reconstructed from old comments.
#
# Background (GH#18356 root-cause analysis, Tier B fix):
#   t1986 closes the parent-task hole (those issues should never dispatch).
#   t2008 closes the no-progress loop (escalates after N consecutive
#   stale-recoveries without a PR).
#   t2007 (this) closes the cost-runaway hole — even when the brief is
#   classified correctly and the recovery counter never trips, a worker
#   stuck in a loop or an unimplementable task can burn unbounded cost
#   across many small attempts. The breaker fires on cumulative spend,
#   independent of attempt count.
#
# Calibration rationale:
#   The breaker is a runaway fail-safe across attempts, not a normal retry
#   governor. GH#39951 replaced the old 800K non-cached budget with a
#   provisional flat 20M full-usage budget. GH#40483 replaced that with
#   measured, tier-split values after the 20M limit tripped on a single
#   ordinary attempt (21.3M spent, 1 attempt, tier:standard).
#   Evidence (tier-telemetry.jsonl, 385 terminal outcomes with captured
#   full-usage tokens, one runner; per single attempt):
#     standard (n=338): p50 4.5M, p90 13.7M, p95 15.6M, max 27.7M, 3 over 20M
#     thinking (n=13):  p50 15.3M, p90 18.6M, p95 21.4M, max 21.4M
#     bundle   (n=34):  p50 5.8M, p90 12.4M, max 16.5M
#     simple:           no samples yet; keeps the previous 20M
#   A budget below the single-attempt tail makes the breaker fire on the first
#   attempt, which defeats a cross-attempt fail-safe and spawns a thinking-tier
#   root-cause worker that costs more than the attempt it reacts to. The new
#   values allow one worst-observed attempt plus a further ordinary attempt:
#   standard ~2.5x p95 (40M), thinking ~3x p95 (60M). Re-measure from the
#   ledger once more thinking/simple samples exist; these are runaway
#   thresholds, not USD cost limits.
#
# Format: KEY=VALUE (no spaces around =, no quotes needed)
# Lines starting with # are comments.
#
# Tuning:
#   Raise budgets if legitimate iteration is being blocked too aggressively.
#   Lower them if real cost incidents are slipping through.
#   Track which issues hit the breaker after 1 week and adjust accordingly.

# tier:simple — no measured samples yet; unchanged from the provisional limit.
COST_BUDGET_SIMPLE=20000000

# tier:standard — ~2.5x the measured single-attempt p95 (15.6M).
COST_BUDGET_STANDARD=40000000

# tier:thinking — ~3x the measured single-attempt p95 (21.4M).
COST_BUDGET_THINKING=60000000

# Default budget when an issue has no tier:* label. Defensive fallback —
# all issues should carry a tier label after issue-sync runs. Matches standard.
COST_BUDGET_DEFAULT=40000000
