#
# Provider IDs whose models run on this device. Single source of truth for
# Vault local-only routing (GH#34125):
#   - headless: scripts/vault-data-policy-helper.sh (_vault_policy_is_local_model)
#   - interactive: plugins/opencode-aidevops/local-only-policy.mjs
# One provider ID per line (the part before "/" in provider/model), matching
# ^[A-Za-z0-9._-]{1,64}$. "#" starts a comment; blank lines are ignored. A
# missing or empty file, or any invalid entry, means no provider is local, so
# local-only work fails closed.
#
# Do not edit this bundled copy: `aidevops update` replaces it. To use your own
# local provider IDs, create the operator override (same format, mode 0600,
# owned by you, not a symlink), which REPLACES this list (GH#35723):
#   ${XDG_CONFIG_HOME:-~/.config}/aidevops/local-ai-providers.conf
# A present but insecure or invalid override means nothing is local.
local
ollama
llama
llama.cpp
llamacpp
