#
# redirect-hosts.conf — URL shorteners and redirectors (GH#35655, t18771)
#
# Single source of truth for the strict no-redirect-link policy:
#   - Public contributions (issues, PRs, comments, discussions) from
#     non-collaborators that contain any of these links are spam: closed or
#     hidden, labelled `spam`, locked without comment, author blocked.
#   - aidevops never resolves, fetches or opens these links in any session
#     (Bash network clients, WebFetch, browser/MCP navigation).
#
# Detection is host-based and NEVER resolves the link: expansion itself
# credits the spam campaign (per-account UTM attribution) and reaches an
# attacker-controlled endpoint.
#
# Format (one entry per line, lowercase, comments with #):
#   host                 exact host and its www. form
#   *.host               any subdomain of host (and host itself)
#   host/path-prefix     only URLs on host (or www.host) whose path starts
#                        with /path-prefix (for redirect endpoints on
#                        otherwise-legitimate sites)
#
# Consumers: scripts/redirect_link_policy.py (scanner), command policy,
# OpenCode/Claude Code URL-tool hooks, redirect-link-guard-helper.sh,
# .github/workflows/redirect-link-spam-guard.yml.

