# Repository-wide mypy config. Onboard a migrated package by adding its path to
# `files` and its component root to `mypy_path`; unmigrated Python stays out.
[mypy]
python_version = 3.10
mypy_path = .agents/worker-lifecycle
files =
    .agents/worker-lifecycle/worker_lifecycle
check_untyped_defs = True
disallow_incomplete_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
incremental = False
cache_dir = /dev/null
