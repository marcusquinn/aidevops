name: Typecheck

# GH#35871: CI is the authority for the TypeScript typecheck. The local
# pre-push hook defers this exact command here when a runner has no installed
# JavaScript dev dependencies, instead of stranding committed worker work.
on:
  pull_request:
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.mts"
      - "**/*.cts"
      - "tsconfig.json"
      - "package.json"
      - "packages/**/package.json"
      - "bun.lock"
      - ".github/workflows/typecheck.yml"
  push:
    branches: [main]
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.mts"
      - "**/*.cts"
      - "tsconfig.json"
      - "package.json"
      - "packages/**/package.json"
      - "bun.lock"
      - ".github/workflows/typecheck.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typecheck-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install locked dev dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run typecheck
