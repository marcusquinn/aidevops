name: Star History (reusable) — generate static README chart

on:
  workflow_call:
    inputs:
      aidevops_repository:
        description: Repository containing the shared chart generator
        required: false
        type: string
        default: marcusquinn/aidevops
      aidevops_ref:
        description: Ref containing the shared chart generator
        required: false
        type: string
        default: main
      runner:
        description: Runner label
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      SYNC_PAT:
        description: Owner-authorised token for stargazer history, branches and pull requests
        required: false

jobs:
  update:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    concurrency:
      group: star-history-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    # PR writes use SYNC_PAT, not GITHUB_TOKEN; keep downstream caller permissions stable.
    steps:
      - name: Require owner-authorised repository token
        id: token
        env:
          SYNC_PAT_PRESENT: ${{ secrets.SYNC_PAT != '' && 'true' || '' }}
        run: |
          if [[ -z "${SYNC_PAT_PRESENT:-}" ]]; then
            echo "present=false" >>"$GITHUB_OUTPUT"
            echo "::warning::Star History skipped: SYNC_PAT is not set. GitHub restricts timestamped stargazer history to repository collaborators. Fix: create a fine-grained PAT limited to this repository with Contents and Pull requests read/write and store it as the SYNC_PAT repository secret (see: aidevops --help sync-pat)."
            echo "Star History skipped: SYNC_PAT repository secret is not set. Create a fine-grained PAT (this repository only, Contents and Pull requests read/write) and store it as SYNC_PAT; see aidevops --help sync-pat." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "present=true" >>"$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.SYNC_PAT }}
          fetch-depth: 1

      - name: Checkout aidevops chart generator
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.aidevops_repository }}
          ref: ${{ inputs.aidevops_ref }}
          path: __aidevops
          fetch-depth: 1

      - name: Generate static Star History chart
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          bash __aidevops/.agents/scripts/star-history-helper.sh fetch \
            --repo "$GITHUB_REPOSITORY" \
            --output docs/assets/star-history.svg

      - name: Propose changed chart through a pull request
        if: steps.token.outputs.present == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/assets/star-history.svg; then
            echo "Star History chart is already current"
            exit 0
          fi
          # Keep one outstanding refresh; never bypass default-branch protection.
          existing_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$DEFAULT_BRANCH" \
            --state open --search '"docs: refresh static star history" in:title' \
            --json title,url --jq '.[] | select(.title == "docs: refresh static star history") | .url')
          if [[ -n "$existing_pr" ]]; then
            echo "Star History refresh already awaiting review: $existing_pr"
            exit 0
          fi
          branch="automation/star-history-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/star-history.svg
          git commit -m "docs: refresh static star history"
          git push origin "HEAD:refs/heads/$branch"
          printf '%s\n' \
            '## Summary' \
            '- Refresh only `docs/assets/star-history.svg` using the shared Star History generator.' \
            '- Generated by the scheduled/manual Star History workflow; merge through normal review and required checks.' \
            '## Verification' \
            '- `star-history-helper.sh fetch` generated the static SVG successfully.' \
            '- Reference: `.github/workflows/star-history-reusable.yml`.' | \
            bash __aidevops/.agents/scripts/gh-write-helper.sh pr create \
              --repo "$GITHUB_REPOSITORY" --base "$DEFAULT_BRANCH" --head "$branch" \
              --title "docs: refresh static star history" --body-file -
