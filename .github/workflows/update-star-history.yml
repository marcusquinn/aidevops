name: Update Star History (legacy manual entry point)

# The weekly schedule lives in star-history.yml. Keep old manual links working
# without maintaining a second generator or attempting protected-branch pushes.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: github.repository == 'marcusquinn/aidevops'
    uses: ./.github/workflows/star-history-reusable.yml
    secrets:
      SYNC_PAT: ${{ secrets.SYNC_PAT }}
