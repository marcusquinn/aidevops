name: Update Star History

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-star-history
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'marcusquinn/aidevops'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require owner-authorised repository token
        env:
          SYNC_PAT_PRESENT: ${{ secrets.SYNC_PAT != '' && 'true' || '' }}
        run: |
          if [[ -z "${SYNC_PAT_PRESENT:-}" ]]; then
            echo "::error::SYNC_PAT is required because GitHub restricts stargazer history to repository collaborators."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ secrets.SYNC_PAT }}
          fetch-depth: 1

      - name: Generate static star-history chart
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          bash .agents/scripts/star-history-helper.sh fetch \
            --repo "$GITHUB_REPOSITORY" \
            --output docs/assets/star-history.svg

      # Use a stable PR branch: main requires reviews and status checks.
      # SYNC_PAT also lets the refresh PR trigger its normal CI workflows.
      - name: Open or update chart refresh pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ secrets.SYNC_PAT }}
          base: main
          branch: automation/update-star-history
          add-paths: docs/assets/star-history.svg
          commit-message: 'docs: refresh static star history'
          title: 'docs: refresh static star history'
          body: |
            Refresh the generated static star-history chart.

            Scope: `docs/assets/star-history.svg` only.
            Generated with `bash .agents/scripts/star-history-helper.sh fetch`.
            Verify the SVG renders and let the normal PR checks and review run before merging.

            [aidevops.sh](https://aidevops.sh) automated chart refresh.
          labels: origin:worker
