name: Refresh macOS Verification

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Metadata only: never check out or execute the untrusted PR head.
      # aidevops:trust-boundary - this can only add a verification handoff label.
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const repo = context.repo;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...repo, pull_number: pr.number, per_page: 100
            });
            // Keep aligned with macos_checks_sensitive in macos-local-checks.sh.
            const sensitive = path =>
              /^\.agents\/scripts\/(?:model-replay-.*|.*sandbox.*|platform-detect\.sh|macos-local-checks\.sh|runtime-env\.sh|trusted.*|git|native_git\.py|canonical.*git.*\.py|canonical_write_policy_paths\.py|command_policy_git_query\.py|tests\/(?:test-model-replay-.*|test-.*git.*\.sh)|setup\/.*)$/.test(path) ||
              path === '.agents/hooks/git_safety_guard.py' ||
              /^\.agents\/plugins\/opencode-aidevops\/(?:runtime-path\.mjs|source-access-.*)$/.test(path) ||
              path === '.github/workflows/path-portability.yml';
            // GitHub caps the file list at 3000. Incomplete coverage fails closed.
            if (pr.changed_files <= files.length && !files.some(file =>
              sensitive(file.filename) || (file.previous_filename && sensitive(file.previous_filename)))) {
              return;
            }
            const label = 'needs-macos-verification';
            try {
              await github.rest.issues.getLabel({...repo, name: label});
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                ...repo, name: label, color: 'D4C5F9',
                description: 'Native macOS checks requested from the registered maintainer'
              });
            }
            // Every new head invalidates earlier native evidence for a sensitive PR.
            // A delayed run may conservatively request a repeat; never clear here.
            await github.rest.issues.addLabels({
              ...repo, issue_number: pr.number, labels: [label]
            });
