#
# PR Triage Gate (t1894)
#
# Analogous to issue-triage-gate.yml but for pull requests.
# Applies needs-maintainer-review to PRs from non-collaborators
# on creation, ensuring the cryptographic approval gate covers PRs
# regardless of how they were created (web UI, API, fork, etc.).
#
# The maintainer-gate.yml enforces this at merge time; this workflow
# ensures the label exists from the moment the PR is opened.

name: PR Triage Gate

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  triage:
    name: PR Author Triage
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: pr-triage-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # GH#35655: redirect-link spam gets no welcome comment. Sparse BASE
      # checkout of the trusted scanner only — never PR head code. Lexical
      # scan only; the link is never resolved.
      - name: Checkout trusted redirect-link scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .agents/configs/redirect-hosts.conf
            .agents/scripts/redirect_link_policy.py
            .agents/scripts/redirect_link_rules.py
          sparse-checkout-cone-mode: false

      - name: Scan for redirect links
        id: redirect
        run: |
          set -uo pipefail
          scanner=".agents/scripts/redirect_link_policy.py"
          spam=false
          if [[ -f "$scanner" ]]; then
            rc=0
            jq -r '[.pull_request.title // "", .pull_request.body // ""] | join("\n")' "$GITHUB_EVENT_PATH" \
              | python3 "$scanner" scan >/dev/null || rc=$?
            [[ "$rc" -eq 1 ]] && spam=true
          fi
          echo "spam=${spam}" >> "$GITHUB_OUTPUT"

      - name: Check author association and apply triage label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REDIRECT_LINK_SPAM: ${{ steps.redirect.outputs.spam }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const association = pr.author_association;

            // OWNER/MEMBER and repository-installed bots are trusted. A bare
            // COLLABORATOR association can represent read/triage access, so it
            // requires a live write-level permission lookup.
            // CONTRIBUTOR (has previous merged PRs) is NOT trusted
            const trustedRoles = ['OWNER', 'MEMBER'];
            let authorIsTrusted = pr.user.type === 'Bot' ||
              trustedRoles.includes(association);
            if (!authorIsTrusted && association === 'COLLABORATOR') {
              try {
                const permissionResponse = await github.request(
                  'GET /repos/{owner}/{repo}/collaborators/{username}/permission',
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    username: author
                  }
                );
                authorIsTrusted = ['admin', 'maintain', 'write'].includes(
                  permissionResponse.data.permission
                );
              } catch (error) {
                core.warning(`Unable to verify collaborator permission for ${author}; preserving PR triage gate: ${error.message}`);
              }
            }

            // #aidevops:trust-boundary GH#17671/GH#28567
            if (authorIsTrusted) {
              console.log(`Author ${author} has verified trusted authority — bypassing triage`);
              return;
            }

            console.log(`Author ${author} has role ${association} — applying triage gate to PR #${pr.number}`);

            // Ensure needs-maintainer-review label exists
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'needs-maintainer-review',
                description: 'External contribution awaiting maintainer approval before pipeline pickup',
                color: 'FBCA04'
              });
            } catch (e) {
              // Label already exists — expected
            }

            // Apply labels
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['needs-maintainer-review', 'external-contributor']
            });

            // Remove any auto-dispatch labels
            for (const label of ['status:available', 'auto-dispatch']) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: label
                });
              } catch (e) {
                // Label not present — fine
              }
            }

            // GH#35655: redirect-link spam is closed silently by the
            // Redirect-Link Spam Guard; never thank or @-mention the author.
            if (process.env.REDIRECT_LINK_SPAM === 'true') {
              console.log(`PR #${pr.number} contains a redirect link — skipping welcome comment`);
              return;
            }

            // Post a comment with approval instructions
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: [
                `Thanks for the contribution, @${author}.`,
                '',
                'This PR has been queued for maintainer review. A maintainer will review it and either:',
                '- **Approve** it using: `sudo aidevops approve pr ' + pr.number + '`',
                '- **Request changes** if modifications are needed',
                '- **Close** it if it\'s a duplicate or out of scope',
                '',
                '**Requirements for external contributor PRs:**',
                '- The PR body **must** reference a linked issue using `Closes #NNN`, `Fixes #NNN`, or `Resolves #NNN`',
                '- If no issue exists for this change, please [create one](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/issues/new) first',
                '- PRs without a linked issue will be blocked by the merge gate',
                '',
                'The PR cannot be merged until a maintainer provides cryptographic approval.'
              ].join('\n')
            });
