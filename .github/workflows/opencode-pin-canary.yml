name: OpenCode Pin Canary

on:
  schedule:
    - cron: "17 6 * * 2"
  workflow_dispatch:
    inputs:
      candidate:
        description: OpenCode candidate version (or latest)
        default: latest
        required: false

permissions:
  contents: read

jobs:
  linux-headless-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        profile: [v1, v2]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Evaluate candidate
        id: canary
        continue-on-error: true
        env:
          CANDIDATE: ${{ inputs.candidate || 'latest' }}
          AIDEVOPS_OPENCODE_PROFILE: ${{ matrix.profile }}
        run: |
          set -o pipefail
          : > canary-result.txt
          .agents/scripts/opencode-pin-canary.sh status | tee pin-status.txt
          .agents/scripts/opencode-pin-canary.sh canary "$CANDIDATE" 2>&1 | tee canary-result.txt

      - name: Preserve canary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opencode-pin-canary-evidence-${{ matrix.profile }}
          path: |
            pin-status.txt
            canary-result.txt
          if-no-files-found: warn
          retention-days: 7

  record-review:
    needs: linux-headless-canary
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [v1, v2]
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download canary evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opencode-pin-canary-evidence-${{ matrix.profile }}

      - name: Record actionable compatibility review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PROFILE: ${{ matrix.profile }}
        run: |
          if grep -q '^RESULT=pass$' canary-result.txt 2>/dev/null; then
            title="Promote passing OpenCode ${PROFILE} compatibility candidate"
            summary="The scheduled isolated Linux-headless OpenCode candidate canary passed."
          elif grep -q '^RESULT=skip$' canary-result.txt 2>/dev/null; then
            # Registry latest already matches the pin; no candidate ran and
            # there is no compatibility failure to dispatch for review.
            exit 0
          else
            title="OpenCode ${PROFILE} compatibility pin review is due"
            summary="The scheduled isolated Linux-headless OpenCode candidate canary did not pass."
          fi
          existing=$(gh api "repos/${REPO}/issues?state=open&per_page=100" \
            --jq ".[] | select(.title == \"${title}\") | .number" | command head -n 1)
          [[ -n "$existing" ]] && exit 0
          # GH#32979: auto-dispatch bodies need a canonical Files Scope (exact
          # repo-relative files) or the pulse pre-claim gate rejects them every
          # cycle; raw canary output stays fenced and bounded.
          status=$(command head -n 60 pin-status.txt) || status="status artifact unavailable"
          result=$(command head -n 60 canary-result.txt) || result="canary artifact unavailable"
          guidance='Investigate missing plugin tools and compare the native tool diff. Retain the current fail-closed pin after failed or inconclusive results; only after a passing rerun advance the profile tested version, pin, dates and result together. Change the plugin package files only when necessary.'
          scope=$(printf '%s\n' '### Files Scope' '' \
            '- .agents/scripts/opencode-pin-canary.sh' \
            '- .agents/configs/opencode-runtime-profiles.json' \
            '- .agents/scripts/shared-constants.sh' \
            '- .agents/plugins/opencode-aidevops/package.json' \
            '- .agents/plugins/opencode-aidevops/package-lock.json')
          verify='Verify with `.agents/scripts/tests/test-opencode-pin-policy.sh`, `.agents/scripts/tests/test-opencode-runtime-profile.sh`, and the workflow canary.'
          body=$(printf '%s\n\nEvidence (first 60 lines of each canary artifact):\n\n~~~text\nStatus:\n%s\n\nResult:\n%s\n~~~\n\n%s\n\n%s\n\n%s\n' \
            "$summary" "$status" "$result" "$guidance" "$scope" "$verify")
          gh api --method POST "repos/${REPO}/issues" -f title="$title" -f body="$body" \
            -f 'labels[]=origin:worker' -f 'labels[]=auto-dispatch' \
            -f 'labels[]=tier:standard' -f 'labels[]=status:available' >/dev/null
