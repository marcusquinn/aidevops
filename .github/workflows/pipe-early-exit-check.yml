name: Pipe Early-Exit Check

# Diff-scoped gate: flags NEW `writer | grep -q` / `grep -m1` / `head` lines in
# scripts that enable pipefail (SIGPIPE false negatives; #27981, #30824, #33882).
# Legacy matches on main never fail a PR; only lines the PR adds are judged.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.sh'

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipe-early-exit-check:
    name: pipe-early-exit-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Get changed shell files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only --diff-filter=AM "$BASE_SHA" "$HEAD_SHA" -- '*.sh' || true)
          if [ -z "$changed" ]; then
            echo "No shell files changed."
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'Changed files:\n%s\n' "$changed"
          echo "has_files=true" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$changed" > "$RUNNER_TEMP/changed-pee-files.txt"

      - name: Run pipe early-exit check
        if: steps.changed.outputs.has_files == 'true'
        id: scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          mapfile -t files < "$RUNNER_TEMP/changed-pee-files.txt"
          output=$(bash .agents/scripts/pipe-early-exit-check.sh --scan-files --diff-base "$BASE_SHA" "${files[@]}" 2>&1)
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$output"
          printf '%s\n' "$output" > "$RUNNER_TEMP/pee-report.txt"

      - name: Post PR comment on failure
        if: steps.changed.outputs.has_files == 'true' && steps.scan.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          report=$(cat "$RUNNER_TEMP/pee-report.txt")
          marker="<!-- pipe-early-exit-check -->"
          body=$(cat <<EOF
          ${marker}
          ## Early-Exit Pipe Readers Under pipefail

          This PR adds lines where a writer is piped into an early-exit reader
          (\`grep -q\`, \`grep -m1\`, \`head\`) in a script that enables \`pipefail\`.
          The reader can close the pipe early, the writer gets SIGPIPE (141), and
          pipefail reports a false "no match" on large input
          ([style guide](.agents/reference/shell-style-guide.md#early-exit-pipe-readers-sigpipe)).

          \`\`\`
          ${report}
          \`\`\`

          **Fix:** use a here-string, e.g. \`grep -qF -- "\$marker" <<<"\$body"\`, or
          capture the output to a variable first. Run
          \`pipe-early-exit-check.sh --fix-hint\` for more patterns.
          EOF
          )

          existing=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.body | contains(\"$marker\")) | .id] | .[0] // empty" \
            2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh api "repos/${REPO}/issues/comments/${existing}" \
              --method PATCH -F body="$body" >/dev/null 2>&1 || true
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$body" \
              >/dev/null 2>&1 || true
          fi

      - name: Enforce gate
        if: steps.changed.outputs.has_files == 'true'
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [ "${EXIT_CODE:-0}" = "0" ]; then
            echo "Pipe early-exit check: clean."
            exit 0
          fi
          if [ "$EXIT_CODE" = "1" ]; then
            echo "::error::Early-exit pipe readers added under pipefail. See PR comment for details."
            exit 1
          fi
          echo "::error::Pipe early-exit check failed with unexpected exit code: $EXIT_CODE"
          exit 1
