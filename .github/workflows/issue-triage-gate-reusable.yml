name: Issue Triage Gate (reusable)

# Reusable workflow — call via a thin caller YAML in each repo.
# See: .agents/templates/workflows/issue-triage-gate-caller.yml
# See: .agents/reference/reusable-workflows.md
#
# The caller declares the `issues: [opened, reopened]` trigger and the
# top-level permissions ceiling (issues: write, contents: read). All triage
# logic lives here so every managed repo applies the same creation-time trust
# labels instead of waiting for the pulse reconcile fallback (GH#36905).
#
# Behaviour:
#   - OWNER/MEMBER, repository bots, and write+ collaborators bypass triage.
#     On `opened`, a stale needs-maintainer-review added by an issue form is
#     removed for them.
#   - Throughput-throttling reports (label or body marker) always keep
#     needs-maintainer-review and are assigned to the repository owner.
#   - Every other author gets needs-maintainer-review + external-contributor
#     (plus a reported origin:* provenance label), loses machine-only debt,
#     unproven origin:worker, auto-dispatch and status:available labels, and
#     receives one welcome comment with the repo-qualified approve command.
#   - Redirect-link spam (GH#35655) still gets the labels but no comment.
#   - `reopened` gates only issues that were never triaged (no
#     external-contributor label), so a reopened, already-approved external
#     issue is not re-gated or re-welcomed.
#
# The redirect-link scanner is fetched from the framework repository at the
# caller's pinned aidevops_ref (never from the caller repository), using
# sparse checkout of three files. Checkout failure is non-fatal: the trust
# labels are the critical outcome; only the spam comment suppression degrades.

on:
  workflow_call:
    inputs:
      aidevops_repository:
        description: 'Repository to fetch the redirect-link scanner from (defaults to the canonical aidevops repository)'
        required: false
        type: string
        default: 'marcusquinn/aidevops'
      aidevops_ref:
        description: 'aidevops ref to fetch the redirect-link scanner from (main, vX.Y.Z, or sha). Keep equal to the caller uses: ref.'
        required: false
        type: string
        default: 'main'
      runner:
        description: 'Runner label override. Defaults to ubuntu-latest.'
        required: false
        default: 'ubuntu-latest'
        type: string
    secrets:
      AIDEVOPS_READ_TOKEN:
        required: false
        description: 'Optional token with read access to a private configured scanner repository'

jobs:
  triage:
    name: Issue Triage Gate
    if: github.event_name == 'issues'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 2
    concurrency:
      group: issue-triage-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
    steps:
      # GH#35655: redirect-link spam gets no welcome comment (no attention, no
      # notification). Lexical scan only; the link is never resolved.
      - name: Checkout trusted redirect-link scanner
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.aidevops_repository || 'marcusquinn/aidevops' }}
          ref: ${{ inputs.aidevops_ref || 'main' }}
          path: __aidevops
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.AIDEVOPS_READ_TOKEN || secrets.GITHUB_TOKEN }}
          sparse-checkout: |
            .agents/configs/redirect-hosts.conf
            .agents/scripts/redirect_link_policy.py
            .agents/scripts/redirect_link_rules.py
          sparse-checkout-cone-mode: false

      - name: Scan for redirect links
        id: redirect
        run: |
          set -uo pipefail
          scanner="__aidevops/.agents/scripts/redirect_link_policy.py"
          spam=false
          if [[ -f "$scanner" ]]; then
            rc=0
            jq -r '[.issue.title // "", .issue.body // ""] | join("\n")' "$GITHUB_EVENT_PATH" \
              | python3 "$scanner" scan >/dev/null || rc=$?
            [[ "$rc" -eq 1 ]] && spam=true
          else
            echo "::warning::Redirect-link scanner unavailable; welcome comment is not spam-suppressed"
          fi
          echo "spam=${spam}" >> "$GITHUB_OUTPUT"

      - name: Check author association and apply triage label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REDIRECT_LINK_SPAM: ${{ steps.redirect.outputs.spam }}
          AIDEVOPS_REPOSITORY: ${{ inputs.aidevops_repository || 'marcusquinn/aidevops' }}
        with:
          script: |
            const issue = context.payload.issue;
            const action = context.payload.action;
            const author = issue.user.login;
            const association = issue.author_association;
            const repoSlug = `${context.repo.owner}/${context.repo.repo}`;
            const issueLabels = new Set((issue.labels || []).map(label => label.name));
            const originMatch = (issue.body || '').match(
              /^<!-- aidevops:origin:(interactive|worker) -->$/m
            );
            const reportedOrigin = originMatch ? `origin:${originMatch[1]}` : null;

            // OWNER/MEMBER are authoritative associations. Other associations
            // may conceal write access (for example private org membership), so
            // require a live write-level lookup rather than relying on association.
            // Repository-installed bots are trusted automation authors, but still
            // run through stale-NMR cleanup below instead of returning early.
            // An explicit external-contributor label records external source
            // provenance even when trusted automation authored the issue.
            const trustedRoles = ['OWNER', 'MEMBER'];
            const hasExternalAuthoritySource = issueLabels.has('external-contributor');
            let authorIsTrusted = !hasExternalAuthoritySource &&
              (issue.user.type === 'Bot' || trustedRoles.includes(association));
            // #aidevops:trust-boundary — lookup errors leave the author untrusted.
            if (!hasExternalAuthoritySource && !authorIsTrusted) {
              try {
                console.log(`Checking repository permission for ${author} with association ${association}`);
                const permissionResponse = await github.request(
                  'GET /repos/{owner}/{repo}/collaborators/{username}/permission',
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    username: author
                  }
                );
                authorIsTrusted = ['admin', 'maintain', 'write'].includes(
                  permissionResponse.data.permission
                );
              } catch (error) {
                core.warning(`Unable to verify collaborator permission for ${author}; treating as untrusted: ${error.message}`);
              }
            }

            // #aidevops:trust-boundary — throughput-throttling reports are a
            // maintainer decision by design. The marker/label only adds a hold
            // and assigns the repository owner; it never grants dispatch.
            // GitHub drops labels set by non-collaborators, so the body marker
            // written by throttle-report-helper.sh is the durable signal.
            const throttleReport = issueLabels.has('throughput-throttle-report') ||
              /^<!-- aidevops:throttle-report -->$/m.test(issue.body || '');
            if (throttleReport && action === 'opened') {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['throughput-throttle-report', 'needs-maintainer-review']
                });
                issueLabels.add('throughput-throttle-report');
                issueLabels.add('needs-maintainer-review');
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  assignees: [context.repo.owner]
                });
              } catch (error) {
                core.warning(`Unable to apply throttle-report hold/assignee: ${error.message}`);
              }
            }

            if (authorIsTrusted) {
              console.log(`Author ${author} has role ${association} — bypassing triage`);

              // Remove needs-maintainer-review if the YAML form template added it.
              // Only on creation: a reopened trusted issue may carry a deliberate
              // maintainer hold, which this gate must never clear. Throttle
              // reports always keep their deliberate maintainer hold.
              if (action === 'opened' && !throttleReport && issueLabels.has('needs-maintainer-review')) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: 'needs-maintainer-review'
                  });
                } catch (error) {
                  core.error(`Unable to remove stale review label: ${error.message}`);
                  throw error;
                }
              }
              return;
            }

            // #aidevops:trust-boundary — persistent is itself an unconditional
            // dispatch blocker. Run trusted-author cleanup first so dashboards
            // do not retain a redundant NMR label; untrusted persistent issues
            // still stop here before any task lifecycle labels are added.
            if (issueLabels.has('persistent')) {
              console.log(`Issue #${issue.number} is persistent — bypassing task triage`);
              return;
            }

            // A reopened issue that already carries external-contributor was
            // triaged before (and may since have been approved, which clears
            // NMR). Re-gating it would demand a second approval and a second
            // welcome comment. Only never-triaged reopened issues continue.
            if (action === 'reopened' && hasExternalAuthoritySource) {
              console.log(`Issue #${issue.number} reopened and already triaged — no change`);
              return;
            }

            console.log(`Author ${author} has role ${association} — applying triage gate`);

            // #aidevops:trust-boundary — the body marker records composition
            // provenance only. External authority remains gated by NMR and the
            // external-contributor label even when an origin marker is present.
            const triageLabels = ['needs-maintainer-review', 'external-contributor'];
            if (reportedOrigin) {
              triageLabels.push(reportedOrigin);
            }

            // Apply the critical trust label and provenance before cleanup/comment calls. Only
            // attempt label creation after addLabels reports a missing/invalid
            // label and getLabel independently confirms a 404.
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: triageLabels
              });
            } catch (addError) {
              if (![404, 422].includes(addError.status)) {
                throw addError;
              }
              let labelIsMissing = false;
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'needs-maintainer-review'
                });
              } catch (lookupError) {
                if (lookupError.status === 404) {
                  labelIsMissing = true;
                } else {
                  throw addError;
                }
              }
              if (!labelIsMissing) {
                throw addError;
              }
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'needs-maintainer-review',
                description: 'External issue awaiting maintainer review before pipeline pickup',
                color: 'FBCA04'
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: triageLabels
              });
            }

            // GH#18197: file-size-debt and function-complexity-debt issues are exclusively
            // machine-generated. A non-maintainer creating one is either a mistake or an
            // attempt to bypass the assignee gate. Strip the label and apply needs-maintainer-review.
            //
            // GH#18623: an unproven origin:worker label is machine-only. Preserve it only
            // when the aidevops footer reports worker composition; NMR and
            // external-contributor still prevent dispatch before approval.
            const debtLabels = ['file-size-debt', 'function-complexity-debt'];
            for (const debtLabel of debtLabels) {
              if (issueLabels.has(debtLabel)) {
                console.log(`Non-maintainer ${author} created issue with ${debtLabel} label — stripping label and gating`);
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: debtLabel
                  });
                } catch (e) {
                  // Label may not be present — fine
                }
              }
            }
            if (issueLabels.has('origin:worker') && reportedOrigin !== 'origin:worker') {
              console.log(`Non-maintainer ${author} created issue with unproven origin:worker label — stripping label`);
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: 'origin:worker'
                });
              } catch (e) {
                // Label may not be present — fine
              }
            }

            // Remove any auto-dispatch labels that could trigger the pipeline
            for (const label of ['status:available', 'auto-dispatch']) {
              if (!issueLabels.has(label)) {
                continue;
              }
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: label
                });
              } catch (e) {
                // Label not present — fine
              }
            }

            // GH#35655: redirect-link spam is closed silently by the
            // Redirect-Link Spam Guard; never thank or @-mention the author.
            if (process.env.REDIRECT_LINK_SPAM === 'true') {
              console.log(`Issue #${issue.number} contains a redirect link — skipping welcome comment`);
              return;
            }

            // Post a welcome comment. The approve command is repo-qualified so a
            // maintainer can run it from any checkout. The /log-issue-aidevops tip
            // only applies to issues filed against the framework repository.
            const welcomeLines = [
              `Thanks for the report, @${author}.`,
              '',
              'This issue has been queued for maintainer review. A maintainer will review it and either:',
              '- **Approve** it using: `sudo aidevops approve issue ' + issue.number + ' ' + repoSlug + '`',
              '- **Ask for more information** if the report needs clarification',
              '- **Close** it if it\'s a duplicate or out of scope'
            ];
            if (repoSlug === process.env.AIDEVOPS_REPOSITORY) {
              welcomeLines.push(
                '',
                '**Tip:** For faster, higher-quality issue reporting, use `/log-issue-aidevops` in your AI assistant session. It gathers diagnostics automatically and checks for duplicates.'
              );
            }
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: welcomeLines.join('\n')
              });
            } catch (error) {
              core.warning(`Review label is applied but welcome comment failed: ${error.message}`);
            }
