#
# Redirect-Link Spam Guard (t18771, GH#35655)
#
# Strict policy: any issue, PR, comment, review comment, discussion or
# discussion comment from a non-collaborator that contains a URL-shortener or
# redirector link (.agents/configs/redirect-hosts.conf) is spam.
#   issue/PR    -> label `spam`, close (not planned), lock (spam)
#   comments    -> minimized as SPAM
#   discussions -> closed (outdated), locked (spam)
# No comment is ever posted. Links are never resolved: detection is lexical.
# Author blocking needs the maintainer token, so the aidevops pulse sweep
# (redirect_spam_sweep_all_repos) completes the ban across repos and orgs.
#
# Canonical incident: GH#35640 — templated "Security boundaries in <repo>"
# issue with an anchor-masked shortener link to a star-exchange site, filed
# across several public repos from a days-old account.
#
# Security: pull_request_target/issue events run the BASE-branch helper only
# (sparse checkout of four trusted files, never PR head code). Event text is
# read by jq from $GITHUB_EVENT_PATH, never interpolated into shell.

name: Redirect-Link Spam Guard

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]
  pull_request_target: # zizmor: ignore[dangerous-triggers] base checkout only, no PR code executed
    types: [opened, edited, reopened]
  pull_request_review_comment:
    types: [created, edited]
  discussion:
    types: [created, edited]
  discussion_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write
  discussions: write

jobs:
  guard:
    name: Redirect-link spam guard
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # #aidevops:trust-boundary GH#17671 — skip trusted authors and bots up front;
    # the helper re-checks author association and collaborator status.
    if: >-
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association ||
        github.event.discussion.author_association ||
        github.event.pull_request.author_association ||
        github.event.issue.author_association) &&
      (github.event.comment.user.type ||
        github.event.discussion.user.type ||
        github.event.pull_request.user.type ||
        github.event.issue.user.type) != 'Bot'
    steps:
      - name: Checkout trusted base helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .agents/configs/redirect-hosts.conf
            .agents/scripts/redirect_link_policy.py
            .agents/scripts/redirect_link_rules.py
            .agents/scripts/redirect-link-guard-helper.sh
          sparse-checkout-cone-mode: false

      - name: Enforce no-redirect-link policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          helper=".agents/scripts/redirect-link-guard-helper.sh"
          if [[ ! -f "$helper" ]]; then
            echo "Redirect-link guard helper missing on base branch; skipping."
            exit 0
          fi
          bash "$helper" enforce-event "$EVENT_NAME" "$GITHUB_EVENT_PATH" "$REPO"
