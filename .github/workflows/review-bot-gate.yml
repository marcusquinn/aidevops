name: Review Bot Gate

# Self-caller for the aidevops repo.
# Upstream logic: .github/workflows/review-bot-gate-reusable.yml
# Downstream template: .agents/templates/workflows/review-bot-gate-caller.yml
# See: .agents/reference/reusable-workflows.md
#
# GH#20727: migrated to reusable-workflow pattern. The helper script is now
# fetched at runtime from marcusquinn/aidevops@main rather than being pinned
# to a hard-coded SHA that silently drifts after helper changes.
#
# The status may remain required for compatibility, but missing/late add-on
# review passes under the permanent fast/advisory default. Strict blocking is
# an explicit completion_behavior opt-in.
#
# Rate-limit behaviour: controlled by `review_gate.rate_limit_behavior` in
# ~/.config/aidevops/repos.json. Default: "pass". See:
# .agents/reference/repos-json-fields.md "review_gate" field.
#
# t1382: https://github.com/marcusquinn/aidevops/issues/2735

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # GH#36961: fork PR runs get a read-only token and cannot post the required
  # review-bot-gate status. pull_request_target evaluates fork PRs in base
  # context; the gate checks out only aidevops scripts at main, never PR code.
  pull_request_target:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  # GH#39418: fork PR review events get a read-only token and cannot clear a
  # failing review-bot-gate status under completion_behavior: strict. workflow_run
  # executes in base context with a write-capable token and never checks out PR code.
  workflow_run: # zizmor: ignore[dangerous-triggers] base context; scripts only, no PR code executed
    workflows: ["Review Bot Gate"]
    types: [completed]
  issue_comment:
    # edited re-triggers when CodeRabbit finalises its Phase 1 placeholder (t2139).
    # Without this trigger, the settlement check would only fire on new comments,
    # not on the Phase 2 edit that makes the placeholder a real review.
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  gate:
    # Apply the complete event matrix before concurrency admission. GitHub keeps
    # only one pending run per group, so a skipped inline reply must never replace
    # the sole queued evaluator. The reusable job repeats this as defence-in-depth.
    # Retired Gemini actors remain only for historical/reinstall compatibility.
    if: >
      (
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.full_name != github.repository
        ) ||
        (
          (
            github.event_name == 'pull_request_review' ||
            (
              github.event_name == 'pull_request_review_comment' &&
              github.event.comment.in_reply_to_id == null
            ) ||
            (github.event_name == 'issue_comment' && github.event.issue.pull_request)
          ) &&
          (
            github.actor == 'coderabbitai' ||
            github.actor == 'coderabbitai[bot]' ||
            github.actor == 'gemini-code-assist' ||
            github.actor == 'gemini-code-assist[bot]' ||
            github.actor == 'augment-code' ||
            github.actor == 'augment-code[bot]' ||
            github.actor == 'augmentcode' ||
            github.actor == 'augmentcode[bot]' ||
            github.actor == 'copilot' ||
            github.actor == 'copilot[bot]' ||
            github.actor == 'github-actions[bot]'
          )
        )
      )
    # Do not cancel an active evaluator (GH#2973). Job-level placement is
    # required: ineligible workflow events skip before entering this group and
    # therefore cannot displace its one pending eligible run (GH#28316).
    concurrency:
      group: review-bot-gate-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    uses: ./.github/workflows/review-bot-gate-reusable.yml
    # Same-repository self-modifying gate PRs exercise their own helper revision.
    # Fork PRs always run the base repository's main helper so a fork cannot
    # supply its own gate logic and main-branch policy fixes reach open PRs.
    with:
      aidevops_ref: ${{ (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha) || 'main' }}
      # Explicit CI opt-in: set this Actions variable to strict when required.
      completion_behavior: ${{ vars.AIDEVOPS_REVIEW_GATE_COMPLETION_BEHAVIOR || 'fast' }}
    secrets: inherit

  # GH#39418: trusted write path for fork PR review events. The same-repository
  # path above is unchanged. This job evaluates the live PR and posts the status;
  # it checks out only aidevops scripts, never fork PR code.
  gate-fork-review:
    if: >
      github.event_name == 'workflow_run' &&
      (
        github.event.workflow_run.event == 'pull_request_review' ||
        github.event.workflow_run.event == 'pull_request_review_comment'
      ) &&
      github.event.workflow_run.head_repository.full_name != github.repository &&
      (
        github.event.workflow_run.actor.login == 'coderabbitai' ||
        github.event.workflow_run.actor.login == 'coderabbitai[bot]' ||
        github.event.workflow_run.actor.login == 'gemini-code-assist' ||
        github.event.workflow_run.actor.login == 'gemini-code-assist[bot]' ||
        github.event.workflow_run.actor.login == 'augment-code' ||
        github.event.workflow_run.actor.login == 'augment-code[bot]' ||
        github.event.workflow_run.actor.login == 'augmentcode' ||
        github.event.workflow_run.actor.login == 'augmentcode[bot]' ||
        github.event.workflow_run.actor.login == 'copilot' ||
        github.event.workflow_run.actor.login == 'copilot[bot]' ||
        github.event.workflow_run.actor.login == 'github-actions[bot]'
      )
    concurrency:
      group: review-bot-gate-fork-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    uses: ./.github/workflows/review-bot-gate-fork-review-reusable.yml
    with:
      aidevops_ref: main
      completion_behavior: ${{ vars.AIDEVOPS_REVIEW_GATE_COMPLETION_BEHAVIOR || 'fast' }}
    secrets:
      AIDEVOPS_READ_TOKEN: ${{ secrets.AIDEVOPS_READ_TOKEN }}
