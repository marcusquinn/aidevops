name: Repository Metrics (reusable) — generate local README data and badges

# Reusable workflow — call via a thin caller YAML in each repo.
# See: .agents/templates/workflows/loc-badge-caller.yml
# See: .agents/aidevops/badges.md
#
# Generates committed local artifacts:
#   docs/metrics/repo-metrics.json
#   docs/metrics/repo-metrics.md
#   docs/metrics/badges/{loc,languages,dependencies}.svg
#
# With `legacy_badge_dir: .github/badges` it also writes legacy loc-total.svg
# and loc-languages.svg for older README blocks. The default is off, so repos
# that sync `.github/` to other repos never copy one repo's badges into another.
#
# The scanner is dependency-light (Python stdlib + git) and skips outputs that
# are already fresh by default, avoiding per-PR delays and noisy badge commits.

on:
  workflow_call:
    inputs:
      aidevops_repository:
        description: 'Repository to fetch the metrics helper from (defaults to the canonical aidevops repository)'
        required: false
        type: string
        default: 'marcusquinn/aidevops'
      aidevops_ref:
        description: 'aidevops ref to fetch the metrics helper from (main, vX.Y.Z, or sha). Empty (default): the commit this reusable workflow was called at, so a caller pinned by SHA gets helpers from the same SHA.'
        required: false
        type: string
        default: ''
      output_dir:
        description: 'Directory to write repo-metrics.json/md to'
        required: false
        type: string
        default: 'docs/metrics'
      badge_dir:
        description: 'Directory to write README SVG badges to'
        required: false
        type: string
        default: 'docs/metrics/badges'
      legacy_badge_dir:
        description: 'Directory for legacy loc-total/loc-languages SVGs. Empty (default) writes none; set .github/badges only for READMEs that still use the legacy paths.'
        required: false
        type: string
        default: ''
      top_n:
        description: 'Top-N languages in the language breakdown SVG'
        required: false
        type: number
        default: 6
      extra_excludes:
        description: 'Newline-separated extra path patterns to exclude'
        required: false
        type: string
        default: ''
      skip_if_fresh_hours:
        description: 'Skip generation when committed metrics are newer than this many hours'
        required: false
        type: number
        default: 24
      commit_message:
        description: 'Commit message subject for metrics updates'
        required: false
        type: string
        default: 'chore(metrics): refresh repository metrics [skip ci]'
      runner:
        description: 'Runner label override. Defaults to ubuntu-latest.'
        required: false
        default: 'ubuntu-latest'
        type: string
      fail_on_push_error:
        description: 'Fail the job when the metrics push is still rejected after retries (for example a missing, expired or under-scoped SYNC_PAT on a protected branch). Set false to keep the old warning-only behaviour.'
        required: false
        type: boolean
        default: true
    secrets:
      AIDEVOPS_READ_TOKEN:
        required: false
        description: 'Optional token with read access to a private configured helper repository'
      SYNC_PAT:
        required: false
        description: 'Fine-grained PAT with Contents:read/write, bypasses branch protection on default-branch push'

jobs:
  generate:
    name: Generate repository metrics
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    concurrency:
      group: repo-metrics-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Skip if commit was made by GitHub Actions
        id: check-author
        env:
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          if [[ "$COMMIT_AUTHOR" == "GitHub Actions" ]] || [[ "$COMMIT_AUTHOR" == "github-actions[bot]" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: commit was made by GitHub Actions (loop prevention)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check SYNC_PAT visibility
        if: steps.check-author.outputs.skip != 'true'
        env:
          SYNC_PAT_PRESENT: ${{ secrets.SYNC_PAT != '' && 'true' || '' }}
          REPO: ${{ github.repository }}
        run: |
          if [[ -z "${SYNC_PAT_PRESENT:-}" ]]; then
            echo "::warning::SYNC_PAT not present in this run — metrics commit may be rejected by branch protection."
            echo "::warning::Set with: gh secret set SYNC_PAT --repo ${REPO} (Contents: Read and write)"
          else
            echo "::notice::SYNC_PAT present — metrics commit will use PAT"
          fi

      - name: Checkout repository
        if: steps.check-author.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      - name: Checkout aidevops framework scripts
        if: steps.check-author.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.aidevops_repository || 'marcusquinn/aidevops' }}
          path: __aidevops
          # An explicit aidevops_ref wins. Otherwise use the commit this reusable
          # workflow file was called at (job.workflow_sha), when helpers come from
          # that same repository, so helpers never drift from the pinned YAML.
          ref: ${{ inputs.aidevops_ref || ((inputs.aidevops_repository || 'marcusquinn/aidevops') == job.workflow_repository && job.workflow_sha) || 'main' }}
          fetch-depth: 1
          token: ${{ secrets.AIDEVOPS_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build extra-excludes args
        id: excludes
        if: steps.check-author.outputs.skip != 'true'
        env:
          EXTRA_EXCLUDES: ${{ inputs.extra_excludes }}
        run: |
          ARGS=""
          if [[ -n "${EXTRA_EXCLUDES:-}" ]]; then
            while IFS= read -r pat; do
              [[ -z "$pat" ]] && continue
              ARGS="$ARGS --exclude $pat"
            done <<< "$EXTRA_EXCLUDES"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Generate repository metrics
        if: steps.check-author.outputs.skip != 'true'
        env:
          OUTPUT_DIR: ${{ inputs.output_dir }}
          BADGE_DIR: ${{ inputs.badge_dir }}
          LEGACY_BADGE_DIR: ${{ inputs.legacy_badge_dir }}
          TOP_N: ${{ inputs.top_n }}
          SKIP_IF_FRESH_HOURS: ${{ inputs.skip_if_fresh_hours }}
          EXTRA_ARGS: ${{ steps.excludes.outputs.args }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          bash __aidevops/.agents/scripts/repo-metrics-helper.sh generate \
            --output-dir "$OUTPUT_DIR" \
            --badge-dir "$BADGE_DIR" \
            --legacy-badge-dir "$LEGACY_BADGE_DIR" \
            --top "$TOP_N" \
            --skip-if-fresh-hours "$SKIP_IF_FRESH_HOURS" \
            $EXTRA_ARGS

      - name: Configure Git
        if: steps.check-author.outputs.skip != 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Commit and push if metrics changed
        if: steps.check-author.outputs.skip != 'true'
        env:
          OUTPUT_DIR: ${{ inputs.output_dir }}
          BADGE_DIR: ${{ inputs.badge_dir }}
          LEGACY_BADGE_DIR: ${{ inputs.legacy_badge_dir }}
          COMMIT_SUBJECT: ${{ inputs.commit_message }}
          FAIL_ON_PUSH_ERROR: ${{ inputs.fail_on_push_error }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          METRIC_PATHS=("$OUTPUT_DIR" "$BADGE_DIR")
          [[ -z "${LEGACY_BADGE_DIR:-}" ]] || METRIC_PATHS+=("$LEGACY_BADGE_DIR")
          if [[ -z "$(git status --porcelain -- "${METRIC_PATHS[@]}")" ]]; then
            echo "No repository metrics changes to commit"
            exit 0
          fi
          git add -- "${METRIC_PATHS[@]}"
          git commit -m "$COMMIT_SUBJECT"
          for i in 1 2 3; do
            echo "Push attempt $i..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            if git push; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            sleep $((i * 3))
          done
          # GH#33583: a rejected push must not look like a passed run, or badges
          # and docs/metrics go stale silently.
          if [[ "${FAIL_ON_PUSH_ERROR:-true}" == "false" ]]; then
            echo "::warning::Failed to push repository metrics updates after 3 attempts (likely branch protection without a valid SYNC_PAT)"
            echo "::warning::Set with: gh secret set SYNC_PAT --repo ${REPO} (Contents: Read and write)"
            exit 0
          fi
          echo "::error::Failed to push repository metrics updates after 3 attempts (likely branch protection without a valid SYNC_PAT)"
          echo "::error::Set with: gh secret set SYNC_PAT --repo ${REPO} (Contents: Read and write)"
          exit 1
