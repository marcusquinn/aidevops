name: Issue Triage Gate

# Thin self-caller. Triage logic lives in issue-triage-gate-reusable.yml so
# managed repositories consume the same creation-time trust gate through
# .agents/templates/workflows/issue-triage-gate-caller.yml (GH#36905).
# The scanner is fetched from this repository at the event commit, matching
# the reusable YAML that `./` resolves to.

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  triage:
    uses: ./.github/workflows/issue-triage-gate-reusable.yml
    with:
      aidevops_repository: ${{ github.repository }}
      aidevops_ref: ${{ github.sha }}
