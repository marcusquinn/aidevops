name: Shell Suite Main Health

# t19150 / GH#39222: the PR gate (affected-tests-helper.sh run --compare-base)
# classifies a suite that is also red on the base as `pre-existing`, so a red
# `main` never fails a PR and nothing recorded it. This scheduled run executes
# every root shell suite on main and fails when a suite is a reproducible
# regression.
#
# GH#39472: this job never writes issues. A public-repo issue write needs the
# private-entity inventory (repos.json) that exists only on maintainer hosts, and
# the privacy guard correctly refuses without it. A failing scheduled run is filed
# by the host-side gh-failure-miner-helper.sh (a failed newest `schedule` run is
# systemic at threshold 1). The TSV and stderr log are attached as an artifact so
# each red classification is inspectable.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  shell-suite-health:
    name: Run all shell suites
    # Scheduled runs remain on main; a trusted manual dispatch can verify a fix
    # on its exact branch before merging and closing the health investigation.
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout suite source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      # GH#39677: the suites assume the maintainer toolchain (the framework's exact
      # search rule makes ripgrep a hard dependency); ubuntu-latest does not ship it,
      # so 158 suites went red at once. Install it and give git a commit identity.
      - name: Install suite toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          rg --version | head -n 1
          # GH#40029: install the manifest-pinned suite tools outside the checkout.
          # NODE_PATH serves CommonJS only: the team-interface ES modules also need
          # node_modules on their ancestor path. Refuse an existing destination.
          ajv_version="$(jq -r '.dependencies.ajv // .devDependencies.ajv' package.json)"
          secretlint_version="$(jq -r '.devDependencies.secretlint' package.json)"
          preset_version="$(jq -r '.devDependencies["@secretlint/secretlint-rule-preset-recommend"]' package.json)"
          deps_dir="${RUNNER_TEMP}/suite-deps"
          if [[ -e node_modules || -L node_modules ]]; then
            echo '::error::Refusing to replace existing node_modules'
            exit 1
          fi
          mkdir -p "$deps_dir"
          npm install --prefix "$deps_dir" --ignore-scripts --no-audit --no-fund \
            "ajv@${ajv_version}" "secretlint@${secretlint_version}" \
            "@secretlint/secretlint-rule-preset-recommend@${preset_version}"
          ln -s "${deps_dir}/node_modules" node_modules
          echo "NODE_PATH=${deps_dir}/node_modules" >> "$GITHUB_ENV"
          echo "${deps_dir}/node_modules/.bin" >> "$GITHUB_PATH"
          node --input-type=module -e 'import Ajv from "ajv/dist/2020.js"; new Ajv();'
          "${deps_dir}/node_modules/.bin/secretlint" --version
          git config --global user.name "aidevops-ci"
          git config --global user.email "ci@aidevops.invalid"

      # Match the pinned AST scanner used by Framework Validation, rather than
      # silently testing the legacy AWK fallback on a runner without shfmt.
      - name: Install pinned shfmt
        timeout-minutes: 5
        env:
          SHFMT_VERSION: v3.8.0
          SHFMT_SHA256: 27b3c6f9d9592fc5b4856c341d1ff2c88856709b9e76469313642a1d7b558fe0
        run: |
          shfmt_tmp="${RUNNER_TEMP}/shfmt"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 15 --max-time 45 -o "$shfmt_tmp" \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          printf '%s  %s\n' "$SHFMT_SHA256" "$shfmt_tmp" | sha256sum --check --strict -
          sudo install -m 0755 "$shfmt_tmp" /usr/local/bin/shfmt
          shfmt --version

      # GH#40011: checkout is not a framework deployment. Helpers resolve shipped
      # defaults and companion scripts at ~/.aidevops/agents; without that tree the
      # health run exercises a missing installation instead of the checked-out code.
      # Stage only repository files: setup.sh would install services and tools.
      - name: Stage checked-out framework
        run: |
          agents_dir="${HOME}/.aidevops/agents"
          if [[ -e "$agents_dir" || -L "$agents_dir" ]]; then
            echo '::error::Refusing to replace an existing framework deployment'
            exit 1
          fi
          mkdir -p "${HOME}/.aidevops"
          ln -s "${GITHUB_WORKSPACE}/.agents" "$agents_dir"
          test -r "${agents_dir}/configs/aidevops.defaults.jsonc"
          test -r "${agents_dir}/configs/aidevops-config.schema.json"
          test -x "${agents_dir}/scripts/config-helper.sh"

      # GH#40029: Vault helpers trust only the managed crypto runtime that setup
      # provisions at ~/.aidevops/.agent-workspace/python-env/vault, so the Vault
      # suites exercised a missing installation. Provision it with the production
      # function and the pinned vault-requirements.txt; no setup.sh, no services.
      - name: Stage managed Vault crypto runtime
        timeout-minutes: 5
        run: |
          env_dir="${HOME}/.aidevops/.agent-workspace/python-env/vault"
          if [[ -e "$env_dir" || -L "$env_dir" ]]; then
            echo '::error::Refusing to replace an existing Vault runtime'
            exit 1
          fi
          # shellcheck source=/dev/null
          source .agents/scripts/setup/_common.sh
          # shellcheck source=/dev/null
          source .agents/scripts/setup/modules/tool-install.sh
          setup_vault_python_env
          "${env_dir}/bin/python3" .agents/scripts/vault-runtime-check.py

      - name: Run every root suite
        id: suites
        env:
          # More red suites than this is a runner/environment storm: one aggregated
          # finding, never a per-suite listing.
          STORM_BOUND: '10'
        run: |
          set -o pipefail
          out="${RUNNER_TEMP}/suite-health"
          mkdir -p "$out"
          results="${out}/suite-results.tsv"
          # Bounded parallelism, per-suite timeout, reruns to drop flakes.
          # Actions runs bash -e: capture the intentional nonzero status explicitly.
          rc=0
          # GH#40066: share an 80-minute execution budget across all passes,
          # leaving 10 minutes for the report/logs before the outer safety timeout.
          timeout --signal=TERM 5400 \
            .agents/scripts/affected-tests-helper.sh all --jobs 4 --timeout 180 --retries 1 --run-budget 4800 \
            --log-dir "${out}/suite-logs" \
            > "$results" 2> "${out}/suite-stderr.log" || rc=$?
          echo "out=${out}" >> "$GITHUB_OUTPUT"
          if [[ "$rc" -eq 124 ]]; then
            echo "::error::Suite run exceeded the 90 minute bound"
            exit 1
          fi
          header=$'suite\trc_head\trc_base\tclass'
          if [[ "$rc" -gt 1 || ( "$rc" -eq 1 && "$(head -n 1 "$results")" != "$header" ) ]]; then
            echo "::error::affected-tests-helper.sh all exited ${rc} without a completed report"
            tail -n 30 "${out}/suite-stderr.log"
            exit 1
          fi

          red="$(awk -F'\t' 'NR>1 && $4=="regression"' "$results" | wc -l | tr -d ' ')"
          timeouts="$(awk -F'\t' 'NR>1 && $4=="regression" && $2 ~ /124/' "$results" | wc -l | tr -d ' ')"
          {
            echo "### Shell suite health on ${GITHUB_REF}"
            echo
            echo "Reproducible regressions: ${red} (of which with a timeout, exit 124: ${timeouts})"
            echo
            if [[ "$red" -gt "$STORM_BOUND" ]]; then
              echo "More than ${STORM_BOUND} red suites: treated as one aggregated finding (runner or environment cause likely). Inspect the \`suite-health\` artifact; per-suite rows are not listed here."
              echo
              echo 'Exit-code distribution (rc_head column of red suites):'
              echo '```'
              awk -F'\t' 'NR>1 && $4=="regression" {n=split($2, a, ","); print a[n]}' "$results" | sort | uniq -c | sort -rn
              echo '```'
            else
              echo '```'
              cat "$results"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$red" -gt "$STORM_BOUND" ]]; then
            echo "::error::${red} red suites on main (storm bound ${STORM_BOUND}); see the suite-health artifact"
          elif [[ "$red" -gt 0 ]]; then
            echo "::error::${red} red suite(s) on main; see the suite-health artifact"
          fi
          # Filing happens host-side from the failed scheduled run (gh-failure-miner-helper.sh).
          [[ "$red" -eq 0 ]]

      - name: Upload suite results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-health
          path: ${{ runner.temp }}/suite-health
          retention-days: 7
          if-no-files-found: warn
