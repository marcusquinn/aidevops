# Repository-wide ruff config. Scope is explicit: onboard a migrated package by
# adding one line to `include` (and one to mypy.ini `files`). Unmigrated Python
# stays outside `include` rather than being masked by ignores. Legacy Python
# keeps its existing pyflakes/lizard checks.
required-version = "==0.11.13"
target-version = "py310"
include = [
    ".agents/worker-lifecycle/**/*.py",
]

[lint]
select = ["E4", "E7", "E9", "F", "B"]
