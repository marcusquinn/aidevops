# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit Pro Configuration for AI-Assisted DevOps Framework
# https://docs.coderabbit.ai/guides/review-instructions

language: "en-US"
early_access: false

tone_instructions: |
  This is an AI-Assisted DevOps Framework with comprehensive automation tools.
  Focus on shell script quality, security best practices, and DevOps automation patterns.
  Zero Technical Debt achieved - maintain A-grade ratings across all quality tools.

reviews:
  profile: "chill"
  high_level_summary: true
  poem: true
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: true

  # Abort in-progress reviews when PR is closed/merged to free up quota.
  # GH#3827: reduces wasted review cycles on PRs that are already resolved.
  abort_on_close: true

  # Auto-review settings — tuned to reduce rate-limit pressure (GH#3827).
  # When many PRs are open simultaneously, CodeRabbit's hourly commit review
  # limit is exhausted. These settings reduce the review volume per PR:
  # - auto_pause_after_reviewed_commits: pause after 3 commits (default 5)
  #   so each PR consumes fewer review slots before requiring manual resume
  # - auto_incremental_review: keep enabled so pushes get reviewed, but the
  #   pause threshold above limits how many times per PR
  # - ignore_title_keywords: skip WIP/draft-like PRs that aren't ready
  # Dependency-update bots intentionally remain reviewable. GitHub reports
  # their PR author association as CONTRIBUTOR, so the GH#17671 trust boundary
  # requires settled review evidence and cannot honor an author-ignore rule.
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 3
    ignore_title_keywords:
      - "WIP"
      - "DO NOT REVIEW"
      - "[skip review]"
    # GH#17671 post-mortem: external-contributor PRs must always be reviewed,
    # even when rate-limited. GH#17904: removed "external-contributor" positive
    # label that was inadvertently disabling internal PR reviews (positive-only
    # filters restrict to matching PRs only).
    #
    # GH#35782: "*" is treated as a required literal label, not an include-all
    # wildcard (PRs #35778 / #35761). The current schema.v2.json, checked
    # 2026-10-28, explicitly supports negative-only exclusions when enabled: true;
    # when enabled: false, negative-only labels do not opt PRs into review.
    # Keep enabled: true above. Unlabeled, internal and external PRs are eligible
    # only when they pass the existing draft/title exclusions and lack no-review.
    # Do not add a positive label requirement.
    # GH#18791 / GH#19770 previously observed negative-only skips: schema validity
    # alone is not runtime proof. Verify a real automatic review and a no-review
    # skip after deployment; do not restore the broken "*" workaround.
    labels:
      - "!no-review"

  # GH#35860: CodeRabbit is advisory (reference/review-bot-gate.md). Keep this
  # false so findings arrive as COMMENTED reviews swept into post-merge
  # follow-up issues. When true, CodeRabbit submits formal CHANGES_REQUESTED
  # reviews, which set reviewDecision and make the pulse t2093 route close and
  # redispatch every worker PR it comments on (15 PRs in one day, 2026-10-28).
  # Review-gate evidence is state-agnostic (bot_has_real_review accepts any
  # settled exact-head bot review), so the GH#17671 external-contributor gate
  # keeps its evidence; commit_status below remains the fallback signal.
  request_changes_workflow: false

  # GH#3932: Enable commit status checks so review-bot-gate-helper.sh can
  # detect CodeRabbit activity via status API when formal reviews are missing
  # due to rate limiting. This provides a fallback signal for the merge gate.
  commit_status: true

  # Exclude certain files from review — expanded to reduce review scope
  # and conserve rate-limit budget (GH#3827).
  path_filters:
    - "!.agents/tmp/**"
    - "!.agents/memory/**"
    - "!*.log"
    - "!*.tmp"
    - "!*.lock"
    - "!package-lock.json"
    - "!yarn.lock"
    - "!pnpm-lock.yaml"
    - "!todo/tasks/*-brief.md"

  # Path-specific instructions
  path_instructions:
    - path: "CHANGELOG.md"
      instructions: |
        Version headings use bare [X.Y.Z] brackets by repository convention.
        Do not flag these headings for missing Markdown reference definitions
        or require adding reference links, including on release-provenance PRs.
        Continue reviewing changelog content for other substantive issues.

    - path: "providers/*.sh"
      instructions: |
        Provider helper scripts - focus on:
        - Consistent API patterns
        - Proper error handling
        - Security of credential handling
        - Input validation

    - path: ".agents/scripts/*.sh"
      instructions: |
        Automation scripts - focus on:
        - Reliability and robustness
        - Clear logging and feedback
        - Proper exit codes
        - Error recovery mechanisms

    - path: "templates/*.sh"
      instructions: |
        Template scripts - focus on:
        - Security (prompt injection protection)
        - Flexibility and reusability
        - Clear documentation
        - Safe defaults

    - path: "**/*.ts"
      instructions: |
        TypeScript files - focus on:
        - Type safety and proper typing
        - Error handling patterns
        - Clean code principles

  # Enable static analysis tools
  tools:
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    hadolint:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true

chat:
  auto_reply: true
